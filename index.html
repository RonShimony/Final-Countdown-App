<!-- This is the entire UI "shell" for the app: one static HTML file that
     never changes shape. app.js fills in dynamic content (the event list,
     the form's current values) by manipulating these elements at runtime -
     there's no template engine or framework generating this markup. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Final Countdown</title>
<!-- viewport-fit=cover lets the page draw under the iPhone's notch/home
     indicator "safe areas"; the CSS then uses env(safe-area-inset-*) to
     pad around them instead of drawing content underneath. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="color-scheme" content="dark">

<!-- iOS "Add to Home Screen" behavior: these tags exist only because
     there's no native iOS app - they tell Safari how to treat this page
     when it's launched as a home-screen icon (full-screen "standalone"
     mode, status bar style, and the icon/title to use). -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Countdown">
<link rel="apple-touch-icon" href="icons/icon-180.png">

<!-- The web app manifest (manifest.webmanifest) describes the app for
     non-iOS installers (Android/desktop Chrome): name, icons, display
     mode, colors. iOS mostly ignores it and relies on the meta tags above
     instead, which is why both are present. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">
  <h1>Final Countdown</h1>
</header>

<!-- app.js/render.js fully rebuild the contents of this element every
     time the data changes (see renderEvents in js/render.js). It starts
     empty in the markup. aria-live="polite" tells screen readers to
     announce content changes here without interrupting the user. -->
<main id="event-list" class="event-list" aria-live="polite"></main>

<!-- Full-screen detail view, opened by tapping a card (see app.js). Its
     content (title, timers) is rebuilt each open/tick by renderDetail in
     js/render.js; only the back/edit buttons here are static. -->
<div id="detail-view" class="detail-view" hidden>
  <div class="detail-view__header">
    <button id="detail-back-btn" type="button" class="btn btn--ghost" aria-label="Back">← Back</button>
    <button id="detail-edit-btn" type="button" class="btn btn--ghost">Edit</button>
  </div>
  <div id="detail-content" class="detail-view__content" aria-live="polite"></div>
</div>

<!-- The floating "+" button (FAB = "floating action button") that opens
     the add-event form. -->
<button id="add-btn" class="fab" type="button" aria-label="Add event">+</button>

<!-- Dimmed overlay shown behind the form sheet; clicking it closes the
     sheet (see app.js). `hidden` is a plain HTML attribute that hides the
     element until app.js removes it. -->
<div id="sheet-backdrop" class="sheet-backdrop" hidden></div>

<!-- This single form is reused for BOTH adding a new event and editing an
     existing one - app.js just changes its title/button visibility and
     pre-fills the fields depending on which mode it's in (see openSheet
     in js/app.js). It's styled as a "bottom sheet" that slides up from
     the bottom of the screen, a common mobile UI pattern. -->
<form id="event-form" class="sheet" hidden novalidate>
  <div class="sheet__handle"></div>
  <h2 id="sheet-title" class="sheet__title">New event</h2>

  <label class="field">
    <span>Title</span>
    <input type="text" id="field-title" name="title" placeholder="e.g. Summer trip" required maxlength="60">
  </label>

  <label class="field">
    <span>Date &amp; time</span>
    <input type="datetime-local" id="field-date" name="date" required>
  </label>

  <label class="field">
    <span>Emoji (optional)</span>
    <input type="text" id="field-emoji" name="emoji" placeholder="🎉" maxlength="4">
  </label>

  <!-- Fixed palette of color swatches. There's no shared JS constant for
       these colors (see CLAUDE.md) - this markup is the only place they're
       defined, so adding/changing a color means editing it here. app.js
       reads each button's data-color attribute to know which color was
       picked (see setSelectedColor in js/app.js). -->
  <div class="field">
    <span>Color</span>
    <div id="color-swatches" class="swatches" role="radiogroup" aria-label="Color">
      <button type="button" class="swatch" data-color="#ff6b6b" style="--sw:#ff6b6b"></button>
      <button type="button" class="swatch" data-color="#ffa94d" style="--sw:#ffa94d"></button>
      <button type="button" class="swatch" data-color="#ffd43b" style="--sw:#ffd43b"></button>
      <button type="button" class="swatch" data-color="#69db7c" style="--sw:#69db7c"></button>
      <button type="button" class="swatch" data-color="#3bc9db" style="--sw:#3bc9db"></button>
      <button type="button" class="swatch" data-color="#4dabf7" style="--sw:#4dabf7"></button>
      <button type="button" class="swatch" data-color="#9775fa" style="--sw:#9775fa"></button>
      <button type="button" class="swatch" data-color="#f783ac" style="--sw:#f783ac"></button>
    </div>
  </div>

  <label class="field field--row">
    <span>Repeats yearly</span>
    <input type="checkbox" id="field-recurring" name="recurring">
  </label>

  <!-- Delete starts hidden; app.js reveals it only when editing an
       existing event (there's nothing to delete for a brand new one). -->
  <div class="sheet__actions">
    <button type="button" id="delete-btn" class="btn btn--danger" hidden>Delete</button>
    <button type="button" id="cancel-btn" class="btn btn--ghost">Cancel</button>
    <button type="submit" class="btn btn--primary">Save</button>
  </div>
</form>

<!-- type="module" loads app.js as a native ES module (enabling `import`/
     `export` between the js/ files with no bundler). Modules are also
     deferred by default, so this script only runs once the HTML above it
     has been parsed - no need for a DOMContentLoaded listener in app.js.
     Note: browsers only allow module imports when the page is served over
     http(s), not opened directly as a file:// path - see CLAUDE.md. -->
<script type="module" src="js/app.js"></script>
</body>
</html>
